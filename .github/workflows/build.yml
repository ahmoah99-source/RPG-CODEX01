name: Build Character Codex APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⠡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK Environment Manually
        run: |
          echo "Setting up Android SDK..."
          mkdir -p $HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          # تثبيت الحزم الأساسية عبر SDK Manager المدمج في أوبونتو إن وجد
          if [ -d "/usr/local/lib/android/sdk" ]; then
            cp -r /usr/local/lib/android/sdk/* $HOME/android-sdk/ || true
          fi

      - name: 📦 Install dependencies & Fix SQLite
        run: |
          npm install --legacy-peer-deps
          npm install expo-sqlite@~14.0.4 --legacy-peer-deps

      - name: 🛠️ Expo Prebuild (Generate Android Native Folders)
        run: npx expo prebuild --platform android --clean

      - name: 🚀 Build Android APK (Local Gradle Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          export NODE_OPTIONS="--max-old-space-size=4096"
          ./gradlew assembleRelease -x test --no-daemon --no-configuration-cache --no-build-cache

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Character-Codex-APK
          path: android/app/build/outputs/apk/release/*.apk
