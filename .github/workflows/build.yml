name: Build Character Codex APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⠡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠️ Expo Prebuild (Generate Android Native Folders)
        run: npx expo prebuild --platform android --clean

      - name: 🚀 Build Android APK (Local Gradle Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          export NODE_OPTIONS="--max-old-space-size=4096"
          ./gradlew assembleRelease -x test --no-daemon --no-configuration-cache --no-build-cache

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Character-Codex-APK
          path: android/app/build/outputs/apk/release/*.apk
