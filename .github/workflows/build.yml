name: Build Character Codex APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⠡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK Environment Manually
        run: |
          echo "Setting up Android SDK..."
          # تثبيت أدوات الأندرويد الأساسية وسداسي أضلاع الـ SDK بشكل مباشر
          mkdir -p $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          # تحميل واستخراج الـ Command line tools إذا لزم، أو الاعتماد على بيئة أوبونتو الجاهزة
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install dependencies & SQLite
        run: |
          npm install --legacy-peer-deps
          npx expo install expo-sqlite --legacy-peer-deps

      - name: 🛠️ Expo Prebuild (Generate Android Native Folders)
        run: npx expo prebuild --platform android --clean

      - name: 🚀 Build Android APK (Local Gradle Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          export NODE_OPTIONS="--max-old-space-size=4096"
          ./gradlew assembleRelease -x test --no-daemon --no-configuration-cache --no-build-cache

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Character-Codex-APK
          path: android/app/build/outputs/apk/release/*.apk
